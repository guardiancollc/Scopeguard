name: ScopeGuard Preview Checks
on:
  push:
    branches: [combined-preview]
  pull_request:
    branches: [combined-preview]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and entitlement checks
        run: npm run check
      - name: Stage native web assets
        run: node mobile/scripts/prepare-web.mjs
      - name: Verify staged mobile assets
        run: node mobile/scripts/verify-web.mjs
